[package]
name = "personal_portfolio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Avneesh Jadhav's personal portfolio, rewritten in Leptos + WASM."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "personal_portfolio"

[dependencies]
leptos = { version = "0.9.0-beta", features = ["csr"] }
leptos-use = "0.19"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.77"
web-sys = { version = "0.3.103", features = [
  "CssStyleDeclaration",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlSpanElement",
  "HtmlHeadingElement",
  "HtmlParagraphElement",
  "HtmlImageElement",
  "HtmlIFrameElement",
  "Node",
  "DomRect",
  "Performance",
  "AddEventListenerOptions",
  "EventListener",
  "Event",
  "MouseEvent",
  "KeyboardEvent",
  "Touch",
  "TouchEvent",
  "TouchInit",
  "TouchList",
  "WheelEvent",
  "IntersectionObserver",
  "IntersectionObserverInit",
  "IntersectionObserverEntry",
  "MediaQueryList",
  "MediaQueryListEvent",
  "ScrollToOptions",
  "ScrollBehavior",
  "Storage",
  "Location",
  "History",
  "Navigator",
] }
gloo = "0.11"
console_log = "1"
log = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3