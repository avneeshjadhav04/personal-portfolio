<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Avneesh Jadhav</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFF9EF;background-image:radial-gradient(#000 1px,transparent 1.2px);background-size:26px 26px;color:#000;padding:1.5rem}
    .box{background:#fff;border:3px solid #000;box-shadow:8px 8px 0 #000;padding:2.5rem 3rem;text-align:center;max-width:34rem;transform:rotate(-1deg)}
    .kicker{display:inline-block;font-family:'Space Mono',monospace;font-size:.72rem;font-weight:700;letter-spacing:.15em;background:#FF90E8;border:2px solid #000;box-shadow:3px 3px 0 #000;padding:.35rem .8rem;margin-bottom:1.25rem}
    h1{font-family:'Archivo Black',sans-serif;font-size:clamp(4rem,14vw,7rem);line-height:.9;margin-bottom:.5rem}
    h1 span{background:#FFDC58;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:0 .2em;display:inline-block;transform:rotate(1deg)}
    p{font-family:'Space Mono',monospace;font-size:.85rem;font-weight:700;letter-spacing:.08em;margin:1.25rem 0 2rem}
    a{display:inline-block;padding:.9rem 1.8rem;border:3px solid #000;background:#000;color:#fff;font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;box-shadow:5px 5px 0 #FFDC58;transition:transform .12s,box-shadow .12s}
    a:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #FFDC58}
    a:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
  </style>
</head>
<body>
  <div class="box">
    <div class="kicker">[ ERROR // 404 ]</div>
    <h1><span>404</span></h1>
    <p>THIS PAGE DOESN'T EXIST. WRONG TURN.</p>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
